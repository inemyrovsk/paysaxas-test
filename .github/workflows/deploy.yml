name: Deploy Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'ansible/**'
      - 'k8s/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  SECRET_NAME: paysaxas/infrastructure

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      nat_ip: ${{ steps.tf-output.outputs.nat_ip }}
      server_ip: ${{ steps.tf-output.outputs.server_ip }}
      cp_lb_ip: ${{ steps.tf-output.outputs.cp_lb_ip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch secrets from Secrets Manager
        id: secrets
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" \
            --query SecretString \
            --output text)
          echo "::add-mask::$(echo "$SECRET_JSON" | jq -r .hcloud_token)"
          echo "::add-mask::$(echo "$SECRET_JSON" | jq -r .ssh_private_key)"
          echo "hcloud_token=$(echo "$SECRET_JSON" | jq -r .hcloud_token)" >> "$GITHUB_OUTPUT"
          echo "admin_ip=$(echo "$SECRET_JSON" | jq -r .admin_ip)" >> "$GITHUB_OUTPUT"
          # Write SSH keys
          mkdir -p ~/.ssh
          echo "$SECRET_JSON" | jq -r .ssh_private_key > ~/.ssh/paysaxas
          echo "$SECRET_JSON" | jq -r .ssh_public_key > ~/.ssh/paysaxas.pub
          chmod 600 ~/.ssh/paysaxas
          echo "$SECRET_JSON" | jq -r .ssh_public_key > /tmp/paysaxas.pub
          echo "ssh_public_key_path=/tmp/paysaxas.pub" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - name: Resolve backend config
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=paysaxas-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=paysaxas/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=paysaxas-tflock" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan
        env:
          TF_VAR_hcloud_token: ${{ steps.secrets.outputs.hcloud_token }}
          TF_VAR_admin_ip: ${{ steps.secrets.outputs.admin_ip }}
          TF_VAR_ssh_public_key_path: ${{ steps.secrets.outputs.ssh_public_key_path }}

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply tfplan
        env:
          TF_VAR_hcloud_token: ${{ steps.secrets.outputs.hcloud_token }}
          TF_VAR_admin_ip: ${{ steps.secrets.outputs.admin_ip }}
          TF_VAR_ssh_public_key_path: ${{ steps.secrets.outputs.ssh_public_key_path }}

      - name: Extract outputs
        id: tf-output
        working-directory: terraform
        run: |
          echo "nat_ip=$(terraform output -raw nat_public_ip)" >> "$GITHUB_OUTPUT"
          echo "server_ip=$(terraform output -raw server_private_ip)" >> "$GITHUB_OUTPUT"
          echo "cp_lb_ip=$(terraform output -raw cp_lb_public_ip)" >> "$GITHUB_OUTPUT"

  configure:
    name: Ansible Configure
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch secrets and write SSH keys
        id: secrets
        run: |
          # Infrastructure secrets (SSH keys, HCLOUD_TOKEN)
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" \
            --query SecretString \
            --output text)
          HCLOUD_TOKEN=$(echo "$SECRET_JSON" | jq -r .hcloud_token)
          echo "::add-mask::$HCLOUD_TOKEN"
          echo "hcloud_token=$HCLOUD_TOKEN" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.ssh
          echo "$SECRET_JSON" | jq -r .ssh_private_key > ~/.ssh/paysaxas
          echo "$SECRET_JSON" | jq -r .ssh_public_key > ~/.ssh/paysaxas.pub
          chmod 600 ~/.ssh/paysaxas

          # Backup credentials (IAM keys for CNPG + K3s etcd)
          BACKUP_JSON=$(aws secretsmanager get-secret-value \
            --secret-id paysaxas/backup \
            --query SecretString \
            --output text)
          echo "backup_access_key_id=$(echo "$BACKUP_JSON" | jq -r .access_key_id)" >> "$GITHUB_OUTPUT"
          echo "backup_secret_access_key=$(echo "$BACKUP_JSON" | jq -r .secret_access_key)" >> "$GITHUB_OUTPUT"
          echo "s3_backup_bucket=$(echo "$BACKUP_JSON" | jq -r .s3_bucket)" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: |
          pip install ansible-core kubernetes
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write Ansible inventory
        run: |
          NAT="${{ needs.terraform.outputs.nat_ip }}"
          K3S="${{ needs.terraform.outputs.server_ip }}"
          LB="${{ needs.terraform.outputs.cp_lb_ip }}"
          cat > ansible/inventory.ini <<EOF
          [nat]
          nat1 ansible_host=${NAT} ansible_user=root ansible_port=22022

          [k3s_servers]
          server1 ansible_host=${K3S} ansible_user=root ansible_port=22022

          [k3s_servers:vars]
          lb_public_ip=${LB}
          ansible_ssh_common_args=-o StrictHostKeyChecking=no -o ProxyCommand="ssh -p 22022 -i ~/.ssh/paysaxas -o StrictHostKeyChecking=no -W %h:%p root@${NAT}"
          EOF
          sed -i 's/^          //' ansible/inventory.ini

      - name: Wait for NAT gateway SSH
        run: |
          NAT="${{ needs.terraform.outputs.nat_ip }}"
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              -i ~/.ssh/paysaxas -p 22022 root@"$NAT" echo ok 2>/dev/null; then
              echo "NAT gateway SSH available on port 22022"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 10
          done

      - name: Wait for K3s server SSH via NAT
        run: |
          NAT="${{ needs.terraform.outputs.nat_ip }}"
          K3S="${{ needs.terraform.outputs.server_ip }}"
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              -i ~/.ssh/paysaxas -p 22022 \
              -o ProxyCommand="ssh -p 22022 -i ~/.ssh/paysaxas -o StrictHostKeyChecking=no -W %h:%p root@${NAT}" \
              root@"$K3S" echo ok 2>/dev/null; then
              echo "K3s server SSH available on port 22022"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 10
          done

      - name: Run Ansible playbook
        run: |
          ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook \
            -i ansible/inventory.ini \
            ansible/site.yml \
            -e "hcloud_token=${{ steps.secrets.outputs.hcloud_token }}" \
            -e "s3_backup_bucket=${{ steps.secrets.outputs.s3_backup_bucket }}" \
            -e "backup_access_key_id=${{ steps.secrets.outputs.backup_access_key_id }}" \
            -e "backup_secret_access_key=${{ steps.secrets.outputs.backup_secret_access_key }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"

      - name: Cleanup SSH keys
        if: always()
        run: rm -f ~/.ssh/paysaxas ~/.ssh/paysaxas.pub
