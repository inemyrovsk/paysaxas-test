[defaults]
inventory = inventory.ini
remote_user = root
private_key_file = ~/.ssh/paysaxas
host_key_checking = False
pipelining = True
stdout_callback = default
result_format = yaml
timeout = 120
gathering = smart
fact_caching = memory

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ServerAliveCountMax=10
