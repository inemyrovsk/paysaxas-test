---
# Flux handles app/namespace/network-policy/gateway manifests via GitOps.
# This playbook only handles post-deploy tasks that need imperative logic.
- name: Post-deploy configuration
  hosts: k3s_servers
  become: true
  tags:
    - deploy
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Wait for Envoy Gateway proxy service
      ansible.builtin.shell:
        cmd: |
          for i in $(seq 1 60); do
            SVC=$(kubectl get svc -n envoy-gateway-system -l gateway.envoyproxy.io/owning-gateway-name=paysaxas-gateway -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            [ -n "$SVC" ] && echo "$SVC" && break
            sleep 5
          done
      register: envoy_svc
      changed_when: false

    - name: Annotate Envoy Gateway service for Hetzner LB
      ansible.builtin.shell:
        cmd: |
          SVC="{{ envoy_svc.stdout | trim }}"
          kubectl annotate svc "$SVC" -n envoy-gateway-system --overwrite \
            load-balancer.hetzner.cloud/name=paysaxas-ingress \
            load-balancer.hetzner.cloud/use-private-ip=true \
            load-balancer.hetzner.cloud/location={{ hetzner_location }} \
            load-balancer.hetzner.cloud/type=lb11 \
            load-balancer.hetzner.cloud/network-zone=eu-central \
            load-balancer.hetzner.cloud/disable-private-ingress=true
      when: envoy_svc.stdout | trim != ""
      changed_when: true

    - name: Wait for Hetzner LB to get external IP
      ansible.builtin.shell:
        cmd: |
          SVC="{{ envoy_svc.stdout | trim }}"
          for i in $(seq 1 60); do
            IP=$(kubectl get svc "$SVC" -n envoy-gateway-system -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$IP" ] && [ "$IP" != "" ]; then
              echo "$IP"
              break
            fi
            sleep 5
          done
      register: app_lb_ip
      changed_when: false
      when: envoy_svc.stdout | trim != ""

    - name: Display App LB IP
      ansible.builtin.debug:
        msg: "App Load Balancer IP: {{ app_lb_ip.stdout | default('pending') }}"
      when: app_lb_ip is defined
