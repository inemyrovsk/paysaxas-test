---
- name: Deploy Kubernetes manifests
  hosts: k3s_servers
  become: true
  tags:
    - deploy
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Create manifests directory on server
      ansible.builtin.file:
        path: /opt/k8s-manifests
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy K8s manifests to server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../k8s/"
        dest: /opt/k8s-manifests/
        owner: root
        group: root
        mode: "0644"

    - name: Apply namespace first
      ansible.builtin.command:
        cmd: kubectl apply -f /opt/k8s-manifests/namespace.yml
      register: ns_apply
      changed_when: "'created' in ns_apply.stdout or 'configured' in ns_apply.stdout"

    - name: Apply remaining K8s manifests
      ansible.builtin.command:
        cmd: kubectl apply -R -f /opt/k8s-manifests/
      register: kubectl_apply
      changed_when: "'created' in kubectl_apply.stdout or 'configured' in kubectl_apply.stdout"

    - name: Wait for Envoy Gateway proxy service
      ansible.builtin.shell:
        cmd: |
          for i in $(seq 1 30); do
            kubectl get svc -n envoy-gateway-system -l gateway.envoyproxy.io/owning-gateway-name=paysaxas-gateway 2>/dev/null | grep -q LoadBalancer && break
            sleep 5
          done
          kubectl get svc -n envoy-gateway-system -l gateway.envoyproxy.io/owning-gateway-name=paysaxas-gateway -o name
      register: envoy_svc
      changed_when: false

    - name: Patch Envoy Gateway proxy to fixed NodePorts
      ansible.builtin.shell:
        cmd: |
          SVC=$(kubectl get svc -n envoy-gateway-system -l gateway.envoyproxy.io/owning-gateway-name=paysaxas-gateway -o jsonpath='{.items[0].metadata.name}')
          kubectl patch svc "$SVC" -n envoy-gateway-system --type='json' -p='[
            {"op": "replace", "path": "/spec/ports/0/nodePort", "value": 30080},
            {"op": "replace", "path": "/spec/ports/1/nodePort", "value": 30443}
          ]' 2>/dev/null || \
          kubectl patch svc "$SVC" -n envoy-gateway-system --type='json' -p='[
            {"op": "replace", "path": "/spec/ports/0/nodePort", "value": 30080}
          ]'
      when: envoy_svc.stdout != ""
      changed_when: true
