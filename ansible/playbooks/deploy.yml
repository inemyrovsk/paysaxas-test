---
- name: Deploy Kubernetes manifests
  hosts: k3s_servers
  become: true
  tags:
    - deploy
  tasks:
    - name: Create manifests directory on server
      ansible.builtin.file:
        path: /opt/k8s-manifests
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy K8s manifests to server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../k8s/"
        dest: /opt/k8s-manifests/
        owner: root
        group: root
        mode: "0644"

    - name: Apply K8s manifests
      ansible.builtin.command:
        cmd: kubectl apply -R -f /opt/k8s-manifests/
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: kubectl_apply
      changed_when: "'configured' in kubectl_apply.stdout or 'created' in kubectl_apply.stdout"
