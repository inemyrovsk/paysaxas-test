---
# Hetzner Cloud Firewall is the primary perimeter firewall.
# UFW serves as defense-in-depth at the host level.

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH ({{ ssh_port }}/tcp)
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow HTTP (80/tcp)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS (443/tcp)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow K8s API (6443/tcp)
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp

- name: Allow private network (10.0.0.0/16)
  community.general.ufw:
    rule: allow
    from_ip: "10.0.0.0/16"

- name: Enable UFW
  community.general.ufw:
    state: enabled
