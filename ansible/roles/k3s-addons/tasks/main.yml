---
- name: Check if Helm is installed
  ansible.builtin.command:
    cmd: which helm
  register: helm_check
  changed_when: false
  failed_when: false

- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm.sh
    mode: "0755"
  when: helm_check.rc != 0

- name: Install Helm
  ansible.builtin.command:
    cmd: /tmp/get-helm.sh
  environment:
    USE_SUDO: "true"
  when: helm_check.rc != 0
  changed_when: true

# --- Cilium CNI ---

- name: Add Cilium Helm repository
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install Cilium
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    chart_version: "{{ cilium_version }}"
    release_namespace: kube-system
    wait: true
    timeout: "5m0s"
    values:
      kubeProxyReplacement: true
      k8sServiceHost: "{{ ansible_host }}"
      k8sServicePort: 6443
      encryption:
        type: wireguard
      gatewayAPI:
        enabled: false
      hubble:
        enabled: true
        relay:
          enabled: true
        ui:
          enabled: false
      operator:
        replicas: 1
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for Cilium pods to be ready
  ansible.builtin.command:
    cmd: >-
      k3s kubectl wait --for=condition=ready pod
      -l app.kubernetes.io/name=cilium-agent
      -n kube-system
      --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# --- Hetzner Cloud Controller Manager ---

- name: Verify K3s API is healthy before CCM install
  ansible.builtin.shell:
    cmd: curl -sk https://127.0.0.1:6443/readyz || curl -sk https://127.0.0.1:6443/healthz
  register: api_health
  retries: 30
  delay: 10
  until: api_health.stdout == "ok" or "Unauthorized" in api_health.stdout
  changed_when: false

- name: Verify K3s built-in cloud controller is not using port 10258
  ansible.builtin.shell:
    cmd: "! ss -tlnp | grep ':10258.*k3s'"
  register: port_check
  retries: 10
  delay: 5
  until: port_check.rc == 0
  changed_when: false

- name: Create hcloud secret for CCM
  ansible.builtin.shell:
    cmd: |
      kubectl create secret generic hcloud --namespace kube-system \
        --from-literal=token="{{ hcloud_token }}" \
        --from-literal=network="paysaxas-network" \
        --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  no_log: true

- name: Add Hetzner Cloud Helm repository
  kubernetes.core.helm_repository:
    name: hcloud
    repo_url: https://charts.hetzner.cloud
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install hcloud-cloud-controller-manager
  kubernetes.core.helm:
    name: hccm
    chart_ref: hcloud/hcloud-cloud-controller-manager
    release_namespace: kube-system
    wait: true
    timeout: "10m0s"
    values:
      networking:
        enabled: true
      secret:
        create: false
        name: hcloud
      env:
        HCLOUD_LOAD_BALANCERS_USE_PRIVATE_IP:
          value: "true"
        HCLOUD_LOAD_BALANCERS_LOCATION:
          value: "{{ hetzner_location }}"
        HCLOUD_LOAD_BALANCERS_ENABLED:
          value: "true"
        HCLOUD_LOAD_BALANCERS_DISABLE_PRIVATE_INGRESS:
          value: "true"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# --- cert-manager ---

- name: Add Jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ certmanager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    wait: true
    timeout: "5m0s"
    values:
      crds:
        enabled: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# --- Envoy Gateway ---

- name: Install Envoy Gateway
  kubernetes.core.helm:
    name: eg
    chart_ref: oci://docker.io/envoyproxy/gateway-helm
    chart_version: "{{ envoy_gateway_version }}"
    release_namespace: envoy-gateway-system
    create_namespace: true
    wait: true
    timeout: "5m0s"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for Envoy Gateway to be ready
  ansible.builtin.command:
    cmd: >-
      kubectl wait --for=condition=available deployment/envoy-gateway
      -n envoy-gateway-system
      --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# --- CloudNativePG ---

- name: Add CloudNativePG Helm repository
  kubernetes.core.helm_repository:
    name: cnpg
    repo_url: https://cloudnative-pg.github.io/charts
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install CloudNativePG operator
  kubernetes.core.helm:
    name: cnpg
    chart_ref: cnpg/cloudnative-pg
    chart_version: "{{ cnpg_version }}"
    release_namespace: cnpg-system
    create_namespace: true
    wait: true
    timeout: "5m0s"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# --- Cluster Autoscaler ---

- name: Read K3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

- name: Set K3s node token fact
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Template worker cloud-init
  ansible.builtin.template:
    src: worker-cloudinit.yml.j2
    dest: /tmp/worker-cloudinit.yml
    owner: root
    group: root
    mode: "0600"

- name: Encode worker cloud-init as base64
  ansible.builtin.shell:
    cmd: base64 -w0 /tmp/worker-cloudinit.yml
  register: cloudinit_b64
  changed_when: false

- name: Set cloud-init base64 fact
  ansible.builtin.set_fact:
    worker_cloudinit_b64: "{{ cloudinit_b64.stdout }}"

- name: Template autoscaler manifest to server
  ansible.builtin.template:
    src: autoscaler.yml.j2
    dest: /tmp/autoscaler.yml
    owner: root
    group: root
    mode: "0600"

- name: Apply autoscaler manifest
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/autoscaler.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: autoscaler_apply
  changed_when: "'created' in autoscaler_apply.stdout or 'configured' in autoscaler_apply.stdout"

- name: Clean up autoscaler manifest (contains secrets)
  ansible.builtin.file:
    path: /tmp/autoscaler.yml
    state: absent

# --- Backup: AWS credentials secret for CNPG ---

- name: Ensure paysaxas namespace exists
  ansible.builtin.shell:
    cmd: kubectl create namespace paysaxas --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Create aws-backup-creds secret for CNPG
  ansible.builtin.shell:
    cmd: |
      kubectl apply -f - <<'EOF'
      apiVersion: v1
      kind: Secret
      metadata:
        name: aws-backup-creds
        namespace: paysaxas
      stringData:
        ACCESS_KEY_ID: "{{ backup_access_key_id }}"
        ACCESS_SECRET_KEY: "{{ backup_secret_access_key }}"
      EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: aws_creds_apply
  changed_when: "'created' in aws_creds_apply.stdout or 'configured' in aws_creds_apply.stdout"
  no_log: true

# --- Backup: CNPG database with S3 backup + ScheduledBackup ---

- name: Template database manifest with backup config
  ansible.builtin.template:
    src: database.yml.j2
    dest: /tmp/database.yml
    owner: root
    group: root
    mode: "0600"

- name: Apply database manifest
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/database.yml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: db_apply
  changed_when: "'created' in db_apply.stdout or 'configured' in db_apply.stdout"

- name: Clean up database manifest
  ansible.builtin.file:
    path: /tmp/database.yml
    state: absent

# --- Backup: K3s etcd snapshots to S3 ---
# cluster-init: true in K3s config enables embedded etcd (same as kube-hetzner)
# This allows native K3s etcd snapshot backup to S3.

- name: Add etcd snapshot config to K3s config
  ansible.builtin.blockinfile:
    path: /etc/rancher/k3s/config.yaml
    marker: "# {mark} ETCD SNAPSHOT CONFIG"
    block: |
      etcd-s3: true
      etcd-s3-bucket: "{{ s3_backup_bucket }}"
      etcd-s3-region: eu-central-1
      etcd-s3-folder: etcd/
      etcd-s3-access-key: "{{ backup_access_key_id }}"
      etcd-s3-secret-key: "{{ backup_secret_access_key }}"
      etcd-snapshot-schedule-cron: "0 */6 * * *"
      etcd-snapshot-retention: 5
      etcd-snapshot-compress: true
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: etcd_snapshot_config

- name: Restart K3s to apply etcd snapshot config
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when: etcd_snapshot_config.changed

- name: Wait for K3s API after etcd config change
  ansible.builtin.shell:
    cmd: curl -sk https://127.0.0.1:6443/readyz
  register: k3s_readyz_etcd
  retries: 30
  delay: 10
  until: k3s_readyz_etcd.stdout == "ok" or "Unauthorized" in k3s_readyz_etcd.stdout
  changed_when: false
  when: etcd_snapshot_config.changed
