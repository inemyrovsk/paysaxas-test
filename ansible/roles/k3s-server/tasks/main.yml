---
- name: Create /var/log/kubernetes directory for audit logs
  ansible.builtin.file:
    path: /var/log/kubernetes
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Create K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write K3s config file
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      kubelet-arg:
        - cloud-provider=external
    owner: root
    group: root
    mode: "0600"

- name: Install K3s server
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server
      --flannel-backend=none
      --disable-network-policy
      --disable-kube-proxy
      --disable=traefik
      --disable=servicelb
      --secrets-encryption
      --node-ip={{ ansible_host }}
      --advertise-address={{ ansible_host }}
      --kube-apiserver-arg=anonymous-auth=false
      --kube-apiserver-arg=audit-log-path=/var/log/kubernetes/audit.log
      --kube-apiserver-arg=audit-log-maxage=30
      --kube-apiserver-arg=audit-log-maxbackup=10
      --kube-apiserver-arg=audit-log-maxsize=100
  notify: Restart k3s

- name: Wait for K3s to be ready
  ansible.builtin.command:
    cmd: k3s kubectl get nodes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: k3s_ready
  retries: 30
  delay: 10
  until: k3s_ready.rc == 0
  changed_when: false

# Node won't be Ready until Cilium CNI is installed (k3s-addons role).
# Only check that the API server responds.

- name: Fetch kubeconfig from server
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/kubeconfig
    flat: true
