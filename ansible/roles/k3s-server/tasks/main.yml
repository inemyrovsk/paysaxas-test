---
- name: Create /var/log/kubernetes directory for audit logs
  ansible.builtin.file:
    path: /var/log/kubernetes
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Create K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write K3s config file
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      tls-san:
        - {{ lb_public_ip }}
      kubelet-arg:
        - cloud-provider=external
      disable-cloud-controller: true
    owner: root
    group: root
    mode: "0600"
  register: k3s_config

- name: Check if K3s is already running
  ansible.builtin.command:
    cmd: systemctl is-active k3s
  register: k3s_running
  changed_when: false
  failed_when: false

- name: Restart K3s to apply config changes
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when: k3s_config.changed and k3s_running.rc == 0

- name: Install K3s server
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server
      --flannel-backend=none
      --disable-network-policy
      --disable-kube-proxy
      --disable=traefik
      --disable=servicelb
      --secrets-encryption
      --node-ip={{ ansible_host }}
      --advertise-address={{ ansible_host }}
      --kube-apiserver-arg=anonymous-auth=false
      --kube-apiserver-arg=audit-log-path=/var/log/kubernetes/audit.log
      --kube-apiserver-arg=audit-log-maxage=30
      --kube-apiserver-arg=audit-log-maxbackup=10
      --kube-apiserver-arg=audit-log-maxsize=100
  notify: Restart k3s

- name: Wait for K3s API to respond
  ansible.builtin.command:
    cmd: k3s kubectl get nodes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: k3s_ready
  retries: 30
  delay: 10
  until: k3s_ready.rc == 0
  changed_when: false

- name: Wait for K3s API to be fully ready
  ansible.builtin.shell:
    cmd: curl -sk https://127.0.0.1:6443/readyz
  register: k3s_readyz
  retries: 30
  delay: 10
  until: k3s_readyz.stdout == "ok" or "Unauthorized" in k3s_readyz.stdout
  changed_when: false

# Node won't be Ready until Cilium CNI is installed (k3s-addons role).
# Only check that the API server responds.

- name: Fetch kubeconfig from server
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/kubeconfig
    flat: true
