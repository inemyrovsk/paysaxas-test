---
# SSH hardening: change port, disable root password login, restrict access.
# Handles the chicken-and-egg: Hetzner provisions with port 22,
# this role switches to ssh_port and reconnects.

- name: Check current SSH port in sshd_config
  ansible.builtin.shell:
    cmd: grep -E '^Port ' /etc/ssh/sshd_config || echo "Port 22"
  register: current_ssh_port
  changed_when: false

- name: Configure sshd to listen on custom port
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port '
    line: "Port {{ ssh_port }}"
  when: "ssh_port | string not in current_ssh_port.stdout"
  notify: Restart sshd

- name: Disable root password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: "PermitRootLogin prohibit-password"
  notify: Restart sshd

- name: Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: "PasswordAuthentication no"
  notify: Restart sshd

- name: Flush handlers to apply sshd changes now
  ansible.builtin.meta: flush_handlers

- name: Switch ansible_port to custom SSH port
  ansible.builtin.set_fact:
    ansible_port: "{{ ssh_port }}"
  when: "ssh_port | string not in current_ssh_port.stdout"

- name: Wait for SSH to come back on new port
  ansible.builtin.wait_for_connection:
    delay: 3
    timeout: 30
  when: "ssh_port | string not in current_ssh_port.stdout"
