---
# NOTE: Hetzner Cloud Firewall is the primary perimeter firewall.
# firewalld serves as defense-in-depth at the host level.

- name: Install firewalld
  community.general.zypper:
    name: firewalld
    state: present

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Allow custom SSH port ({{ ssh_port }}/tcp)
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Allow HTTP (80/tcp)
  ansible.posix.firewalld:
    port: 80/tcp
    permanent: true
    immediate: true
    state: enabled

- name: Allow HTTPS (443/tcp)
  ansible.posix.firewalld:
    port: 443/tcp
    permanent: true
    immediate: true
    state: enabled

- name: Allow K8s API (6443/tcp)
  ansible.posix.firewalld:
    port: 6443/tcp
    permanent: true
    immediate: true
    state: enabled

- name: Remove default SSH service (port 22)
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: disabled

- name: Reload firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
