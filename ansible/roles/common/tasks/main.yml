---
- name: Force apt cache update
  ansible.builtin.apt:
    update_cache: true

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - ca-certificates
    state: present

- name: Install fail2ban (may not be in minimal images)
  ansible.builtin.apt:
    name: fail2ban
    state: present
  ignore_errors: true
  register: fail2ban_install

- name: Configure systemd-timesyncd with Hetzner NTP
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf
    content: |
      [Time]
      NTP=ntp1.hetzner.de ntp2.hetzner.com ntp3.hetzner.net
    owner: root
    group: root
    mode: "0644"

- name: Enable and start timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true
  ignore_errors: true

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  when: fail2ban_install is succeeded

- name: Configure fail2ban SSH jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22022
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 5
      bantime = 3600
      findtime = 600
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
  when: fail2ban_install is succeeded
