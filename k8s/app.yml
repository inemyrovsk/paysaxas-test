apiVersion: apps/v1
kind: Deployment
metadata:
  name: paysaxas-app
  namespace: paysaxas
  labels:
    app.kubernetes.io/name: paysaxas-app
    app.kubernetes.io/part-of: paysaxas
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paysaxas-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paysaxas-app
        app.kubernetes.io/part-of: paysaxas
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: ghcr.io/inemyrovsk/paysaxas-test/app:v0.0.1-53 # {"$imagepolicy": "flux-system:paysaxas-app"}
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              value: paysaxas-db-pooler
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: paysaxas-db-app
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: paysaxas-db-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paysaxas-db-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: paysaxas-db-app
                  key: dbname
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: paysaxas-app
  namespace: paysaxas
  labels:
    app.kubernetes.io/name: paysaxas-app
    app.kubernetes.io/part-of: paysaxas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paysaxas-app
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
