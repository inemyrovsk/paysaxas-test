---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: paysaxas-gateway
  namespace: paysaxas
  labels:
    app.kubernetes.io/name: paysaxas-gateway
    app.kubernetes.io/part-of: paysaxas
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    # TODO: Add HTTPS listener with cert-manager TLS certificate
    # - name: https
    #   protocol: HTTPS
    #   port: 443
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - kind: Secret
    #         name: paysaxas-tls
    #   allowedRoutes:
    #     namespaces:
    #       from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paysaxas-route
  namespace: paysaxas
  labels:
    app.kubernetes.io/name: paysaxas-route
    app.kubernetes.io/part-of: paysaxas
spec:
  parentRefs:
    - name: paysaxas-gateway
      namespace: paysaxas
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: paysaxas-app
          port: 5000
